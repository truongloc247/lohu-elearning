<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <title>Danh sách Flashcard</title>
</head>
<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar()}"></div>
        <div class="container">
            <div th:object="${flashCardSet}">
                <h2 th:text="*{name}"></h2>
                <div>
                    <div th:text="*{isPublic} ? 'Riêng tư' : 'Công khai'"></div>
                    <div th:text="*{modifiedDate}"></div>
                </div>
                <div th:text="*{description}"></div>
            </div>
            <div class="d-flex justify-content-between">
                <a class="btn btn-primary" th:href="@{/user/flashCardSet/{id}/flashCard/create(id=${flashCardSet.id})}">Thêm mới</a>
                <form class="d-flex gap-2" th:action="@{/user/flashCardSet/{id}(id=${flashCardSet.id})}">
                    <input type="text" class="form-control" name="searchKey" placeholder="Nhập thuật ngữ hoặc định nghĩa" th:value="${searchKey}">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                </form>
            </div>
            <div>
                <div th:each="flashCard : ${flashCards}" th:object="${flashCard}">
                    <div>
                        <img th:if="flashCard.images" th:src="@{${flashCard.image}}">
                        <img th:if="flashCard == null" src="#">
                    </div>
                    <div>
                        <div>
                            <div>Thuật ngữ</div>
                            <div th:text="*{term}"></div>
                        </div>
                        <div>
                            <div>Định nghĩa</div>
                            <div th:text="*{definition}"></div>
                        </div>
                    </div>
                    <div>
                        <a th:href="@{'/user/flashCardSet/' + ${flashCardSet.id} + '/flashCard/edit/' + *{id}}">Chỉnh sửa</a>
                        <a >Xóa</a>
                    </div>
                </div>
                <div th:if="${totalPages < 1}">Không có flash card nào!</div>
            </div>
            <div th:if="${totalPages > 0}">
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="'page-item' + ${currentPage == i ? ' active' : ''}">
                            <a class="page-link" th:href="@{'/user/flashCardSet/' + ${flashCardSet.id} + '?pageNumber=' + ${i} + ${searchKey != null ? '&searchKey=' + searchKey : ''}}" th:text="${i}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script th:if="${message}" th:inline="javascript">
        Toastify({
            text: [[${message}]],
            duration: 3000,
            gravity: "top",
            position: "right",
            stopOnFocus: true,
            style: {
                background: "#198754",
                zIndex: 9999,
                boxShadow: "0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23)"
            }
        }).showToast();
    </script>

    <script th:src="@{/js/sidebar.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
