<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh sách bộ flash card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link rel="stylesheet" th:href="@{/css/card.css}">

  <style>
    :root {
      --primary-color: #6f42c1;
      --primary-hover: #59359a;
      --primary-light: #f3f0ff;
    }

    /* 1. Cố định chiều cao trang web, không cho body cuộn */
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover, .btn-primary:active, .btn-primary:focus {
      background-color: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
    }

    .nav-underline .nav-link {
      color: #6c757d;
      font-weight: 500;
    }

    .nav-underline .nav-link:hover {
      color: var(--primary-color);
    }

    .nav-underline .nav-link.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }

    .page-link {
      color: var(--primary-color);
    }

    .page-link:hover {
      color: var(--primary-hover);
      background-color: var(--primary-light);
    }

    .page-item.active .page-link {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .form-control:focus {
      border-color: #bca2eb;
      box-shadow: 0 0 0 0.25rem rgba(111, 66, 193, 0.25);
    }

    .text-purple {
      color: var(--primary-color) !important;
    }

    .badge-purple-subtle {
      background-color: var(--primary-light);
      color: var(--primary-color);
      border: 1px solid #e0d4fc;
    }

    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
      transition: all 0.3s ease;
    }

    /* 2. Tùy chỉnh thanh cuộn (Scrollbar) */
    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #bca2eb;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }
  </style>
</head>
<body>
<div class="d-flex vh-100">
  <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

  <div class="flex-grow-1 h-100 overflow-y-auto custom-scroll">
    <div class="container py-4">
      <h2 class="fw-bold text-purple mb-4">Bộ flash card được chia sẻ</h2>

      <div class="mb-4">
        <ul class="nav nav-underline border-bottom">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/user/flashCardSet/all}">Thư mục của bạn</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" th:href="@{/user/flashCardSet/public}">Khám phá</a>
          </li>
        </ul>
      </div>

      <div class="d-flex justify-content-end mb-4">
        <form class="d-flex w-50" th:action="@{/user/flashCardSet/public}">
          <div class="input-group">
            <input type="text" class="form-control" name="searchKey" placeholder="Nhập tên bộ flash card..." th:value="${searchKey}">
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
          </div>
        </form>
      </div>

      <div class="row row-cols-1 row-cols-md-2 g-4 mb-4">
        <div class="col" th:each="flashCardSet : ${flashCardSets}" th:object="${flashCardSet}">
          <div class="card h-100 shadow-sm border-0 rounded-3 card-hover">
            <div class="card-body d-flex flex-column p-4">
              <div class="mb-2">
                <h5 class="card-title fw-bold text-dark mb-1" th:text="*{name}">Card title</h5>

                <div class="text-muted small mb-2">
                  <i class="bi bi-person-circle me-1"></i>
                  <span th:text="'Tác giả: ' + *{user.name}"></span>
                </div>

                <div class="d-flex gap-2 align-items-center">
                                    <span class="badge rounded-pill badge-purple-subtle"
                                          th:text="*{isPublic} ? 'Công khai' : 'Riêng tư'"></span>
                  <small class="text-muted">
                    <i class="bi bi-clock me-1"></i><span th:text="*{modifiedDate}"></span>
                  </small>
                </div>
              </div>

              <p class="card-text text-secondary flex-grow-1" th:text="*{description}"
                 style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              </p>

              <div class="d-flex gap-2 mt-3 pt-3 border-top mt-auto">
                <a th:href="@{/user/flashCardSet/play/{id}(id=*{id})}" class="btn btn-primary flex-fill fw-medium">
                  <i class="bi bi-play-circle me-1"></i> Bắt đầu học
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${totalPages < 1}" class="text-center py-5 text-muted bg-white rounded shadow-sm">
        <i class="bi bi-globe-asia-australia display-4 mb-3 d-block text-secondary"></i>
        <p class="fs-5">Không có bộ flash card nào được chia sẻ!</p>
      </div>

      <div th:if="${totalPages > 0}" class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation example">
          <ul class="pagination shadow-sm">
            <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="'page-item' + ${currentPage == i ? ' active' : ''}">
              <a class="page-link shadow-none" th:href="@{'/user/flashCardSet/public?pageNumber=' + ${i} + ${searchKey != null ? '&searchKey=' + searchKey : ''}}" th:text="${i}"></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
