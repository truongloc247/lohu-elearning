<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo mới flash card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">

    <style>
        :root {
            --primary-color: #6f42c1;
            --primary-hover: #59359a;
            --primary-light: #f3f0ff;
        }

        body {
            background-color: #f8f9fa;
        }

        /* Button styles */
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover, .btn-primary:active, .btn-primary:focus {
            background-color: var(--primary-hover) !important;
            border-color: var(--primary-hover) !important;
        }

        /* Form styles */
        .form-control:focus {
            border-color: #bca2eb;
            box-shadow: 0 0 0 0.25rem rgba(111, 66, 193, 0.25);
        }

        .form-label {
            font-weight: 500;
            color: #495057;
        }

        .text-purple {
            color: var(--primary-color) !important;
        }
    </style>
</head>
<body>
<div class="d-flex min-vh-100">
    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="alert alert-danger shadow-sm mb-4" role="alert" th:if="${message}">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${message}"></span>
                </div>

                <div class="card border-0 shadow rounded-4 bg-white">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-purple">Tạo thẻ ghi nhớ mới</h2>
                            <p class="text-muted">Thêm từ vựng và định nghĩa để bắt đầu học</p>
                        </div>

                        <form enctype="multipart/form-data" th:action="@{/user/flashCardSet/{flashCardSetId}/flashCard/doCreate(flashCardSetId=${flashCardCreationRequest.flashCardSetId})}" th:method="post" th:object="${flashCardCreationRequest}">

                            <div class="mb-4">
                                <label class="form-label" th:for="name">Thuật ngữ <span class="text-danger">*</span></label>
                                <input class="form-control form-control-lg bg-light" th:field="*{term}" type="text" placeholder="Nhập từ vựng...">
                                <span class="text-danger small mt-1 d-block" th:errors="*{term}"></span>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" th:for="definition">Mô tả / Định nghĩa <span class="text-danger">*</span></label>
                                <input class="form-control form-control-lg bg-light" th:field="*{definition}" type="text" placeholder="Nhập ý nghĩa...">
                                <span class="text-danger small mt-1 d-block" th:errors="*{definition}"></span>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" th:for="image">Ảnh minh họa (Tùy chọn)</label>
                                <input class="form-control" th:field="*{image}" type="file" accept="image/*">
                                <div class="form-text">Hỗ trợ định dạng JPG, PNG.</div>
                            </div>

                            <input type="text" class="d-none" th:field="*{flashCardSetId}">

                            <div class="d-grid mt-5">
                                <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">
                                    <i class="bi bi-plus-circle me-2"></i>Xác nhận
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <a href="javascript:history.back()" class="text-decoration-none text-secondary">
                                    <i class="bi bi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
