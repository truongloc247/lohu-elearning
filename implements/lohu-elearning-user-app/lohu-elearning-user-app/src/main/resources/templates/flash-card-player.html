<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <title>Chơi flash card</title>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="container-fluid py-4 px-5" style="background-color: #f9fafb;">
        <div class="bg-white p-4 rounded-4 shadow-sm mb-4" th:object="${flashCardSet}">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h2 class="fw-bold text-purple mb-2" th:text="*{name}"></h2>
                    <div class="text-muted small mb-3" th:text="*{description}"></div>
                    <div class="d-flex align-items-center text-secondary small">
                        <i class="bi bi-clock-history me-1"></i>
                        <span class="me-1">Cập nhật:</span>
                        <span th:text="*{modifiedDate}"></span>
                    </div>
                </div>
                <span class="badge rounded-pill bg-purple-light text-purple px-3 py-2">
                    <span th:text="*{isPublic} ? 'Công khai' : 'Riêng tư'"></span>
                </span>
            </div>
        </div>

        <div class="d-flex gap-3 mb-4">
            <a class="btn btn-purple text-white shadow-sm fw-semibold px-4 rounded-3"
               th:href="@{/user/flashCardSet/play/{id}(id=${flashCardSet.id})}">
                <i class="bi bi-shuffle me-2"></i>Trộn ngẫu nhiên
            </a>
            <a class="btn btn-outline-purple fw-semibold px-4 rounded-3"
               th:href="@{/user/flashCardSet/all}">
                <i class="bi bi-arrow-left me-2"></i>Thoát
            </a>
        </div>

        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
                <div th:each="flashCard, iterStat : ${flashCardSet.getFlashCards()}"
                     th:object="${flashCard}"
                     class="carousel-item"
                     th:classappend="${iterStat.index == 0} ? 'active'"
                     onclick="flipCard(this)">

                    <div class="flash-card-inner">
                        <div class="card-face front-face">
                            <div class="card-content-wrapper">
                                <div class="img-col" th:if="*{image}">
                                    <img th:src="@{*{image}}">
                                </div>
                                <div class="text-col">
                                    <div class="label-text">THUẬT NGỮ</div>
                                    <div class="main-text" th:text="*{term}"></div>
                                    <div class="hint-text">(Nhấn để xem định nghĩa)</div>
                                </div>
                            </div>
                        </div>

                        <div class="card-face back-face">
                            <div class="card-content-wrapper">
                                <div class="img-col" th:if="*{image}">
                                    <img th:src="@{*{image}}" style="opacity: 0.7">
                                </div>
                                <div class="text-col">
                                    <div class="label-text">ĐỊNH NGHĨA</div>
                                    <div class="main-text definition-text" th:text="*{definition}"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</div>

<style>
    :root {
        --main-purple: #6f42c1;
        --light-purple-bg: #ede9fe;
        --text-purple: #5b21b6;
        --card-height: 450px;
    }

    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9fafb;
    }

    .text-purple { color: var(--text-purple) !important; }
    .bg-purple-light { background-color: var(--light-purple-bg) !important; }

    .btn-purple {
        background-color: var(--main-purple);
        border: none;
    }
    .btn-purple:hover { background-color: #5a32a3; }

    .btn-outline-purple {
        color: var(--main-purple);
        border-color: var(--main-purple);
    }
    .btn-outline-purple:hover {
        background-color: var(--main-purple);
        color: white;
    }

    #carouselExample {
        width: 100%;
        perspective: 2000px;
    }

    .carousel-item {
        height: var(--card-height);
        cursor: pointer;
        padding: 10px;
    }

    .flash-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
    }

    .flash-card-inner.is-flipped {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;

        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.05);

        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        overflow: hidden;
    }

    .back-face {
        transform: rotateY(180deg);
        background-color: #fff;
    }

    .card-content-wrapper {
        display: flex;
        align-items: center;
        gap: 40px;
        width: 100%;
        max-width: 900px;
        height: 100%;
    }

    .img-col {
        flex: 0 0 300px;
        height: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f9fa;
        border-radius: 12px;
        overflow: hidden;
    }
    .img-col img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .text-col {
        flex: 1;
        text-align: left;
        height: 100%;
        overflow: hidden;

        display: flex;
        flex-direction: column;
    }

    .label-text {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--main-purple);
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 1px;

        flex-shrink: 0;
    }

    .main-text {
        font-size: 3rem;
        font-weight: 800;
        color: #333;
        line-height: 1.3;

        flex-grow: 1;
        overflow-y: auto;
        padding-right: 10px;

        word-wrap: break-word;
        word-break: break-word;

        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .main-text {
        display: block;
    }

    .definition-text {
        font-size: 2.2rem;
        font-weight: 700;
        color: #444;
    }

    .hint-text {
        margin-top: 15px;
        font-size: 0.9rem;
        color: #999;
        font-style: italic;

        flex-shrink: 0;
    }

    .main-text::-webkit-scrollbar {
        width: 6px;
    }
    .main-text::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
    }
    .main-text::-webkit-scrollbar-thumb {
        background: #d1c4e9;
        border-radius: 10px;
    }
    .main-text::-webkit-scrollbar-thumb:hover {
        background: var(--main-purple);
    }

    .carousel-control-prev, .carousel-control-next {
        width: 50px; height: 50px;
        background-color: var(--main-purple);
        border-radius: 50%;
        top: 50%; transform: translateY(-50%);
        opacity: 0.3;
        transition: 0.3s;
        z-index: 10;
    }
    .carousel-control-prev:hover, .carousel-control-next:hover {
        opacity: 1;
    }
    .carousel-control-prev { left: 20px; }
    .carousel-control-next { right: 20px; }

</style>

<script>
    function flipCard(element) {
        const innerCard = element.querySelector('.flash-card-inner');
        if (innerCard) {
            innerCard.classList.toggle('is-flipped');
        }
    }
</script>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
