<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --brand-purple: #6f42c1;
            --brand-purple-hover: #59359a;
            --brand-purple-soft: #f3f0ff;
        }

        body {
            background-color: #f8f9fa;
            background-image: radial-gradient(var(--brand-purple) 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            background-opacity: 0.05;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .register-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(111, 66, 193, 0.1);
            background: #fff;
            max-width: 550px;
            width: 100%;
        }

        .card-header-purple {
            background: linear-gradient(135deg, var(--brand-purple) 0%, #8e44ad 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 30px;
            text-align: center;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dee2e6;
        }

        .form-control:focus {
            border-color: var(--brand-purple);
            box-shadow: 0 0 0 0.25rem rgba(111, 66, 193, 0.15);
        }

        .form-control[readonly] {
            background-color: #e9ecef;
            opacity: 0.8;
        }

        .btn-register {
            background-color: var(--brand-purple);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            color: white;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-register:hover {
            background-color: var(--brand-purple-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(111, 66, 193, 0.3);
            color: white;
        }

        .error-text {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }

        .gender-group {
            background: var(--brand-purple-soft);
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card register-card">
        <div class="card-header-purple">
            <h2 class="mb-0 fw-bold">Đăng ký tài khoản</h2>
        </div>

        <div class="card-body p-4 p-md-5">
            <form th:action="@{/user/create}" method="post" th:object="${userCreationRequest}">

                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label" th:for="name">Tên:</label>
                        <input type="text" class="form-control" th:field="*{name}" placeholder="Nhập vào tên"/>
                        <span class="error-text" th:errors="*{name}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="gender">Giới tính:</label>
                        <div class="gender-group">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="radio" th:field="*{gender}" value="true" id="male">
                                <label class="form-check-label" for="male">Nam</label>
                            </div>
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="radio" th:field="*{gender}" value="false" id="female">
                                <label class="form-check-label" for="female">Nữ</label>
                            </div>
                        </div>
                        <span class="error-text" th:errors="*{gender}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="dateOfBirth">Ngày sinh:</label>
                        <input type="date" class="form-control" th:field="*{dateOfBirth}"/>
                        <span class="error-text" th:errors="*{dateOfBirth}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="phoneNumber">Số điện thoại:</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Nhập vào số điện thoại"/>
                        <span class="error-text" th:errors="*{phoneNumber}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="email">Email:</label>
                        <input type="text" class="form-control" th:field="*{email}" readonly="readonly"/>
                        <span class="error-text" th:errors="*{email}"></span>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label" th:for="address">Địa chỉ:</label>
                        <input type="text" class="form-control" th:field="*{address}" placeholder="Nhập địa chỉ"/>
                        <span class="error-text" th:errors="*{address}"></span>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="col-12 mb-3">
                        <label class="form-label" th:for="username">Tên đăng nhập:</label>
                        <input type="text" class="form-control" th:field="*{username}" placeholder="Nhập tên đăng nhập"/>
                        <span class="error-text" th:errors="*{username}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="password">Mật khẩu:</label>
                        <input type="password" class="form-control" th:field="*{password}" placeholder="Nhập mật khẩu"/>
                        <span class="error-text" th:if="${message}" th:text="${message}"></span>
                        <span class="error-text" th:errors="*{password}"></span>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:for="confirmPassword">Xác nhận mật khẩu:</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Nhập mật khẩu xác nhận"/>
                        <span class="error-text" th:if="${message}" th:text="${message}"></span>
                        <span class="error-text" th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-register shadow-sm">Đăng ký</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
