<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký PREMIUM - LOHU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">

    <style>
        :root {
            --brand-purple: #6f42c1;
            --brand-purple-hover: #59359a;
            --brand-purple-subtle: #f3f0ff;
            --text-dark: #343a40;
            --text-muted: #6c757d;
        }

        /* 1. Cấu hình Scrollbar & Body */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Scrollbar tím */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d0c2f0; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--brand-purple); }

        /* Background Pattern: Chấm bi tím nhạt */
        .content-wrapper {
            background-color: #f8f9fa;
            background-image: radial-gradient(rgba(111, 66, 193, 0.15) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }

        /* Card Premium Design */
        .card-premium-modern {
            border: 1px solid rgba(111, 66, 193, 0.1); /* Viền tím siêu mờ */
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(111, 66, 193, 0.1); /* Bóng đổ tím nhẹ */
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-premium-modern:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(111, 66, 193, 0.2);
        }

        /* Dải màu Gradient trên đầu card */
        .card-top-accent {
            height: 8px;
            background: linear-gradient(90deg, #a575ed 0%, var(--brand-purple) 50%, #59359a 100%);
            width: 100%;
        }

        .text-purple { color: var(--brand-purple) !important; }

        /* Button Glow Effect */
        .btn-purple-glow {
            background-color: var(--brand-purple);
            color: white;
            border: none;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(111, 66, 193, 0.3);
            transition: all 0.2s ease-in-out;
        }

        .btn-purple-glow:hover {
            background-color: var(--brand-purple-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(111, 66, 193, 0.4);
        }

        .btn-purple-glow:active {
            transform: translateY(0);
        }

        /* Feature Box */
        .feature-box {
            background-color: var(--brand-purple-subtle);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(111, 66, 193, 0.05);
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 500;
        }

        .feature-item i {
            font-size: 1.2rem;
            flex-shrink: 0;
            color: var(--brand-purple); /* Icon màu tím */
            margin-right: 12px;
        }

        /* User Info Box */
        .user-info-box {
            background: #fff;
            padding: 24px 24px 10px 24px;
        }

        /* Avatar Container */
        .avatar-circle {
            width: 70px;
            height: 70px;
            background-color: var(--brand-purple-subtle);
            color: var(--brand-purple);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .price-tag {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--brand-purple);
            line-height: 1;
            letter-spacing: -1px;
        }
    </style>
</head>
<body>

<div class="d-flex vh-100">

    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="content-wrapper flex-grow-1 h-100 overflow-y-auto custom-scroll d-flex align-items-center justify-content-center p-4">

        <div class="container" style="max-width: 480px;">
            <div class="card card-premium-modern">
                <div class="card-top-accent"></div>

                <div class="user-info-box text-center" th:object="${user}">
                    <div class="avatar-circle shadow-sm">
                        <i class="bi bi-person-fill"></i>
                    </div>

                    <h5 class="fw-bold mb-1 text-dark" th:text="*{name}">User Name</h5>
                    <p class="text-muted small mb-2" th:text="*{email}">email@example.com</p>

                    <div class="badge rounded-pill px-3 py-2 mt-1"
                         th:classappend="*{vipExpirationDate} == null ? 'bg-secondary bg-opacity-75' : 'bg-success bg-gradient'">
                        <i class="bi bi-stars me-1"></i>
                        <span th:text="*{vipExpirationDate} == null ? 'Tài khoản thường' : 'Hạn Premium: ' + *{vipExpirationDate}"></span>
                    </div>
                </div>

                <div class="card-body p-4 pt-2 text-center">
                    <hr class="text-muted opacity-25 mx-4 mb-4">

                    <div class="mb-2">
                        <span class="badge bg-warning text-dark rounded-pill px-3 py-2 shadow-sm border border-white">
                            <i class="bi bi-lightning-fill me-1"></i> Phổ biến nhất
                        </span>
                    </div>

                    <h3 class="fw-bold mb-1 text-purple">LOHU Premium</h3>
                    <p class="text-muted small mb-4">Nâng cấp để học tập hiệu quả hơn gấp 10 lần</p>

                    <div class="my-4 d-flex justify-content-center align-items-end">
                        <span class="h3 mb-2 me-1 text-muted fw-bold">₫</span>
                        <span class="price-tag" th:text="${@environment.getProperty('lohu.premium.price')}"></span>
                        <span class="text-muted fw-medium fs-6 ms-1 mb-2">/ tháng</span>
                    </div>

                    <div class="feature-box text-start">
                        <div class="feature-item">
                            <i class="bi bi-check-circle-fill"></i>
                            <span>Tạo Flashcard tự động bằng AI</span>
                        </div>
                    </div>

                    <div class="mt-4">
                        <a th:href="@{/user/premium/pay}" class="btn btn-purple-glow w-100 rounded-pill d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-gem"></i> Đăng ký / Gia hạn ngay
                        </a>
                        <div class="mt-3 text-muted d-flex align-items-center justify-content-center gap-2" style="font-size: 0.8rem;">
                            <i class="bi bi-shield-lock-fill text-success"></i> Thanh toán an toàn 100%
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
