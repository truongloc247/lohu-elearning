<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký PREMIUM - LOHU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/sidebar.css}">

    <style>
        :root {
            --brand-purple: #6f42c1;
            --brand-purple-light: #f3f0ff; /* Màu nền tím rất nhạt */
            --brand-purple-hover: #59359a;
        }

        /* Nền của vùng nội dung chính */
        .content-wrapper {
            background-color: #f8f9fa; /* Màu xám rất nhạt cho nền tổng thể */
            background-image: radial-gradient(#e0cffc 1px, transparent 1px); /* Họa tiết chấm bi mờ (tùy chọn) */
            background-size: 20px 20px;
        }

        /* Card thiết kế mới */
        .card-premium-modern {
            border: none;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 15px 35px rgba(111, 66, 193, 0.15); /* Bóng đổ mềm mại màu tím */
            overflow: hidden;
            position: relative;
        }

        /* Dải màu trang trí trên đầu card */
        .card-top-accent {
            height: 8px;
            background: var(--brand-purple);
            width: 100%;
        }

        .text-purple {
            color: var(--brand-purple) !important;
        }

        .btn-purple-glow {
            background-color: var(--brand-purple);
            color: white;
            border: none;
            padding: 12px 0;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(111, 66, 193, 0.4); /* Nút phát sáng nhẹ */
            transition: all 0.3s ease;
        }

        .btn-purple-glow:hover {
            background-color: var(--brand-purple-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(111, 66, 193, 0.5);
            color: white;
        }

        /* Khung chứa danh sách tính năng */
        .feature-box {
            background-color: var(--brand-purple-light);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #555;
        }

        .feature-item:last-child {
            margin-bottom: 0;
        }

        .feature-item i {
            font-size: 1.2rem;
            flex-shrink: 0; /* Icon không bị co lại */
        }
    </style>
</head>
<body>

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="content-wrapper flex-grow-1 d-flex align-items-center justify-content-center p-4 min-vh-100">

        <div class="container" style="max-width: 500px;"> <div class="card card-premium-modern">
            <div class="card-top-accent"></div>

            <div th:object="${user}">
                <div th:text="*{name}"></div>
                <div th:text="*{email}"></div>
                <div th:text="*{vipExpirationDate} == null ? 'Chưa kích hoạt' : 'Hạn sử dụng PREMIUM: ' + *{vipExpirationDate}"></div>
            </div>

            <div class="card-body p-4 p-md-5 text-center">

                <div class="mb-2">
                        <span class="badge bg-warning text-dark rounded-pill mb-3 px-3 py-2">
                            <i class="bi bi-star-fill me-1"></i> Phổ biến nhất
                        </span>
                </div>

                <h2 class="fw-bold mb-1 text-dark">LOHU Premium</h2>
                <p class="text-muted small">Mở khóa sức mạnh AI cho việc học</p>

                <div class="my-4">
                    <div class="d-flex justify-content-center align-items-end text-purple">
                        <span class="display-3 fw-bold lh-1" th:text="${@environment.getProperty('lohu.premium.price')}"></span>
                        <span class="h3 mb-2 me-1">₫</span>
                    </div>
                    <span class="text-muted small">/ tháng</span>
                </div>

                <div class="feature-box text-start text-dark">
                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill text-purple me-3"></i>
                        <span>Tạo hàng loạt Flash card với prompt chỉ trong một nốt nhạc</span>
                    </div>
                </div>

                <div class="mt-4">
                    <a th:href="@{/user/premium/pay}" class="btn btn-purple-glow w-100 rounded-pill">
                        Đăng ký/Gia hạn ngay
                    </a>
                    <div class="mt-3 text-muted" style="font-size: 0.8rem;">
                        <i class="bi bi-shield-lock"></i> Thanh toán an toàn 100%
                    </div>
                </div>

            </div>
        </div>

        </div>
    </div>
</div>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
