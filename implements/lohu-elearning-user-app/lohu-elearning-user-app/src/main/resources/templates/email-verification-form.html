<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Xác thực Email</title>

    <style>
        :root {
            --primary-color: #6f42c1;
            --primary-hover: #59359a;
            --primary-light: #f3f0ff;
        }

        body {
            background-color: #f8f9fa;
        }

        .bg-purple-gradient {
            background: linear-gradient(135deg, #6f42c1 0%, #4e2a96 100%);
            color: white;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover, .btn-primary:active, .btn-primary:focus {
            background-color: var(--primary-hover) !important;
            border-color: var(--primary-hover) !important;
        }

        .form-control:focus {
            border-color: #bca2eb;
            box-shadow: 0 0 0 0.25rem rgba(111, 66, 193, 0.25);
        }

        .text-purple {
            color: var(--primary-color) !important;
        }

        a.text-secondary:hover {
            color: var(--primary-color) !important;
        }
    </style>
</head>
<body>
<div class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row bg-white shadow-lg rounded-4 overflow-hidden" style="min-height: 500px;">

            <div class="col-md-7 d-flex flex-column align-items-center justify-content-center bg-purple-gradient p-5 text-center">
                <h1 class="display-3 fw-bold mb-3">LOHU</h1>
                <p class="fs-4 fw-light">Ghi nhớ dễ hơn bao giờ hết</p>
                <i class="bi bi-postcard-heart" style="font-size: 5rem; opacity: 0.5"></i>
            </div>

            <div class="col-md-5 d-flex flex-column justify-content-center p-5">
                <div class="mb-4 text-center">
                    <h2 class="fw-bold text-purple">Xác thực Email</h2>
                    <p class="text-muted small">Vui lòng nhập email để tiếp tục</p>
                </div>

                <form class="d-flex flex-column gap-3" th:action="@{/auth/sendEmail}" method="post" th:object="${emailVerificationRequest}">
                    <div>
                        <label class="form-label fw-medium text-secondary">Địa chỉ Email</label>
                        <input class="form-control form-control-lg bg-light" type="email" th:field="*{email}" placeholder="name@example.com" required>
                        <div class="mt-1 small">
                            <span class="text-danger" th:errors="*{email}"></span>
                            <span class="text-danger" th:if="${message}" th:text="${message}"></span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center mt-2">
                        <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Xác nhận</button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <a class="link-underline link-underline-opacity-0 text-secondary" th:href="@{/login}">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
