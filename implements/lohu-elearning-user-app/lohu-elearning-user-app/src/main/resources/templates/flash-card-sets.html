<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/card.css}">
    <title>Danh sách thư mục học tập</title>
</head>
<body>
    <div class="d-flex">
        <div th:replace="~{fragments/sidebar :: sidebar()}"></div>
        <div class="container">
            <h2>Thư viện của bạn</h2>
            <div>
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Thư mục</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex justify-content-between">
                <a class="btn btn-primary" th:href="@{/user/flashCardSet/create}">Tạo mới</a>
                <form class="d-flex gap-2" th:action="@{/user/flashCardSet/all}">
                    <input type="text" class="form-control" name="searchKey" placeholder="Nhập tên bộ flash card" th:value="${searchKey}">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i></button>
                </form>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <div class="card" style="width: 18rem;" th:each="flashCardSet : ${flashCardSets}" th:object="${flashCardSet}">
                    <div class="card-body d-flex flex-column">
                        <div>
                            <h5 class="card-title" th:text="*{name}">Card title</h5>
                            <div class="d-flex gap-2 mb-2">
                                <span th:text="*{isPublic} ? 'Công khai' : 'Riêng tư'"></span>
                                <span th:text="*{modifiedDate}"></span>
                            </div>
                        </div>
                        <div class="card-text" th:text="*{description}"></div>
                        <div class="d-flex gap-2 mb-2 mt-auto">
                            <a href="#" class="btn btn-primary flex-fill">Bắt đầu học</a>
                            <div class="dropdown">
                                <button class="btn btn-secondary" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" th:href="@{/user/flashCardSet/edit/{id}(id=*{id})}">Chỉnh sửa thông tin</a></li>
                                    <li><a class="dropdown-item" th:href="@{/user/flashCardSet/{id}(id=*{id})}">Danh sách thẻ</a></li>
                                    <li><a class="dropdown-item" th:href="@{/user/flashCardSet/delete/{id}(id=*{id})}" onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${totalPages < 1}">Không có thư mục học tập nào!</div>
            </div>
            <div th:if="${totalPages > 0}">
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:class="'page-item' + ${currentPage == i ? ' active' : ''}">
                            <a class="page-link" th:href="@{'/user/flashCardSet/all?pageNumber=' + ${i} + ${searchKey != null ? '&searchKey=' + searchKey : ''}}" th:text="${i}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
    <script th:src="@{/js/sidebar.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
