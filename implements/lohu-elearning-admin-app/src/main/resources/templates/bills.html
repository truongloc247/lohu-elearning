<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <title>Danh sách hóa đơn</title>
    <style>
        :root {
            --brand-purple: #6f42c1;
            --brand-purple-light: #f3f0ff;
        }

        /* Reset & Layout */
        body, html {
            height: 100%;
            overflow: hidden; /* Ngăn cuộn toàn trang */
            background-color: #f8f9fa;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Container bao quanh toàn bộ phần nội dung (search + table + pagination) */
        .content-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            height: 100%; /* Chiếm hết chiều cao còn lại */
            overflow: hidden;
        }

        /* Header của card (chứa search) */
        .card-header-section {
            padding: 1.25rem;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        /* --- PHẦN QUAN TRỌNG: Xử lý cuộn cho bảng --- */
        .table-scroll-container {
            flex-grow: 1; /* Tự động dãn ra để chiếm không gian giữa */
            overflow-y: auto; /* Cuộn dọc */
            overflow-x: auto; /* Cuộn ngang trên mobile */
        }

        .table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #fcfaff;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-top: none;
            padding: 1rem;
            box-shadow: inset 0 -1px 0 #dee2e6;
        }

        /* Tùy chỉnh thanh cuộn */
        .table-scroll-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-scroll-container::-webkit-scrollbar-track { background: transparent; }
        .table-scroll-container::-webkit-scrollbar-thumb { background: #d0c2f0; border-radius: 10px; }
        .table-scroll-container::-webkit-scrollbar-thumb:hover { background: var(--brand-purple); }

        /* Phân trang cố định ở dưới */
        .card-footer-section {
            padding: 1rem;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        /* UI Elements */
        .text-purple { color: var(--brand-purple) !important; }
        .badge-status { padding: 0.5rem 0.8rem; border-radius: 50px; font-weight: 500; font-size: 0.85rem; }
        .btn-confirm {
            background-color: var(--brand-purple);
            color: white;
            border-radius: 8px;
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-confirm:hover { background-color: #59359a; color: white; box-shadow: 0 4px 10px rgba(111, 66, 193, 0.2); }
        .page-link { color: var(--brand-purple); border: none; background: #f3f0ff; margin: 0 2px; border-radius: 6px; }
        .page-item.active .page-link { background-color: var(--brand-purple); color: white; }
    </style>
</head>
<body>
<div class="d-flex min-vh-100 w-100">
    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="main-content">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0">
            <h4 class="fw-bold mb-0 text-dark">Quản lý hóa đơn</h4>
            <span class="badge bg-purple-light text-purple px-3 py-2" style="background: var(--brand-purple-light)">
                Admin Panel
            </span>
        </div>

        <div class="content-card">

            <div class="card-header-section">
                <form class="row g-3" th:action="@{/admin/bills}">
                    <div class="col-auto">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-filter"></i></span>
                            <input type="date" class="form-control border-start-0 shadow-none" name="searchDate" th:value="${searchDate}">
                            <button type="submit" class="btn btn-primary" style="background-color: var(--brand-purple); border: none;">
                                <i class="bi bi-search me-1"></i> Lọc
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-scroll-container">
                <table th:if="${totalPages > 0}" class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Email</th>
                        <th>Ngày tạo</th>
                        <th>Đơn giá</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="bill : ${bills}" th:object="${bill}">
                        <td class="fw-bold text-purple" th:text="'#' + *{id}"></td>
                        <td th:text="*{user.name}"></td>
                        <td class="text-muted small" th:text="*{user.email}"></td>
                        <td th:text="*{creationDate}"></td>
                        <td class="fw-bold">₫[[*{amount}]]</td>
                        <td>
                                <span th:class="*{isPurchased} ? 'badge bg-success-subtle text-success badge-status' : 'badge bg-warning-subtle text-warning badge-status'">
                                    <i th:class="*{isPurchased} ? 'bi bi-check-circle-fill me-1' : 'bi bi-clock-fill me-1'"></i>
                                    <th:block th:text="*{isPurchased} ? 'Đã thanh toán' : 'Chờ xác nhận'"></th:block>
                                </span>
                        </td>
                        <td class="text-end">
                            <a th:if="!*{isPurchased}" th:href="@{/admin/bills/confirmBill/{id}(id=*{id})}" class="btn-confirm" onclick="return confirm('Bạn chắc chắn xác nhận?')">
                                Xác nhận
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div th:if="${totalPages < 1}" class="text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted opacity-25"></i>
                    <p class="text-muted mt-2">Không có hóa đơn nào được tìm thấy.</p>
                </div>
            </div>

            <div th:if="${totalPages > 0}" class="card-footer-section">
                <nav>
                    <ul class="pagination pagination-sm justify-content-center mb-0">
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:class="'page-item' + ${currentPage == i ? ' active' : ''}">
                            <a class="page-link shadow-none"
                               th:href="@{'/admin/bills?pageNumber=' + ${i} + ${searchDate != null ? '&searchDate=' + searchDate : ''}}"
                               th:text="${i}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<script th:if="${message}" th:inline="javascript">
    Toastify({
        text: [[${message}]],
        duration: 3000,
        gravity: "top", position: "right",
        style: { background: "#198754", borderRadius: "10px" }
    }).showToast();
</script>
<script th:if="${emailErrorMessage}" th:inline="javascript">
    Toastify({
        text: [[${emailErrorMessage}]],
        duration: 3000,
        gravity: "top", position: "right",
        style: { background: "#dc3545", borderRadius: "10px" }
    }).showToast();
</script>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
