<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống kê doanh thu - LOHU Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body>

<div class="d-flex min-vh-100">
    <div th:replace="~{fragments/sidebar :: sidebar()}"></div>

    <div class="container-fluid p-4" style="background-color: #f8f9fa;">

        <div class="bg-white p-4 rounded shadow-sm">

            <h2 class="border-bottom pb-2 mb-4" style="color: #6f42c1; font-weight: bold;">
                <i class="bi bi-graph-up"></i>
                Thống kê doanh thu năm <span th:text="${currentYear}"></span>
            </h2>

            <div style="position: relative; height: 60vh; width: 100%">
                <canvas id="month-sta"></canvas>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    /* --- Lấy dữ liệu từ Java --- */
    var monthlyRevenue = [[${monthlyRevenue}]];

    // Tạo nhãn tháng tự động
    var labels = [];
    for(let i = 1; i <= 12; i++) {
        labels.push("Tháng " + i);
    }

    const ctx = document.getElementById('month-sta').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Doanh thu (VNĐ)',
                data: monthlyRevenue,
                backgroundColor: 'rgba(111, 66, 193, 0.6)', // Màu tím
                borderColor: 'rgba(111, 66, 193, 1)',      // Viền tím đậm
                borderWidth: 1,
                borderRadius: 5
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) {
                                label += ': ';
                            }
                            if (context.parsed.y !== null) {
                                label += new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(context.parsed.y);
                            }
                            return label;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function(value, index, values) {
                            return new Intl.NumberFormat('vi-VN', { compactDisplay: "short", notation: "compact" }).format(value) + ' đ';
                        }
                    }
                }
            }
        }
    });
</script>

<script th:src="@{/js/sidebar.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
